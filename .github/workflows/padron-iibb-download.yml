# ============================================================
# GitHub Actions Workflow: Descarga Padrón IIBB Jujuy
# ============================================================
# Este workflow descarga el padrón de percepciones IIBB de Jujuy
# y lo publica como Release para que el servidor WordPress
# pueda descargarlo sin problemas de IP baneada.
#
# Ejecución:
#   - Automática: días 1 al 5 de cada mes a las 5:30 UTC (2:30 AM Argentina)
#   - Manual: desde la pestaña Actions con año/mes opcionales
#
# Por qué días 1-5 y no solo el día 1:
#   Rentas no siempre publica el padrón el día 1. En 2026-08 lo publicó más
#   tarde, el único intento del día 1 recibió HTTP 404 y el release nunca se
#   creó (run #8 falló). Corriendo varios días se cubre ese caso; el step
#   "Verificar si ya existe el release" corta la ejecución los días posteriores
#   al que tuvo éxito, así que no se duplica nada.
# ============================================================

name: Descarga Padrón IIBB Jujuy

on:
  # Cron: días 1 al 5 de cada mes a las 5:30 UTC (2:30 AM hora Argentina)
  schedule:
    - cron: '30 5 1-5 * *'

  # Permitir ejecución manual
  workflow_dispatch:
    inputs:
      year:
        description: 'Año (YYYY) - dejar vacío para mes actual'
        required: false
        type: string
      month:
        description: 'Mes (01-12) - dejar vacío para mes actual'
        required: false
        type: string

jobs:
  download-padron:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Necesario para crear releases

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Calcular periodo
        id: periodo
        run: |
          # Si se especificó año/mes manualmente, usarlos
          if [ -n "${{ github.event.inputs.year }}" ] && [ -n "${{ github.event.inputs.month }}" ]; then
            YEAR="${{ github.event.inputs.year }}"
            MONTH="${{ github.event.inputs.month }}"
          else
            # Usar fecha actual
            YEAR=$(date +%Y)
            MONTH=$(date +%m)
          fi

          # Asegurar que el mes tenga 2 dígitos
          MONTH=$(printf "%02d" $((10#$MONTH)))

          FILENAME="PADRONRETPER${YEAR}${MONTH}.rar"
          TAG="padron-${YEAR}-${MONTH}"

          echo "year=$YEAR" >> $GITHUB_OUTPUT
          echo "month=$MONTH" >> $GITHUB_OUTPUT
          echo "filename=$FILENAME" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT

          echo "📅 Periodo: $YEAR-$MONTH"
          echo "📦 Archivo: $FILENAME"
          echo "🏷️  Tag: $TAG"

      - name: Verificar si ya existe el release
        id: check_release
        run: |
          TAG="${{ steps.periodo.outputs.tag }}"

          # Verificar si el tag ya existe
          if gh release view "$TAG" &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "⚠️ El release $TAG ya existe"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "✅ El release $TAG no existe, se creará"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Descargar RAR de Rentas Jujuy
        if: steps.check_release.outputs.exists == 'false'
        id: download
        run: |
          FILENAME="${{ steps.periodo.outputs.filename }}"
          URL="https://www.rentasjujuyonline.gob.ar/cedulavirtual/SalidaPadronAgentes/${FILENAME}"

          DIA_DEL_MES=$(date +%-d)

          echo "🌐 Descargando desde: $URL"
          echo "📆 Día del mes: $DIA_DEL_MES"

          # 3 intentos con espera, para absorber errores transitorios de red
          HTTP_CODE=000
          for i in 1 2 3; do
            HTTP_CODE=$(curl -L -w "%{http_code}" -o "$FILENAME" \
              -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
              -H "Accept: application/octet-stream,*/*" \
              -H "Accept-Language: es-AR,es;q=0.9" \
              --connect-timeout 30 \
              --max-time 300 \
              "$URL") || true
            echo "  intento $i → HTTP $HTTP_CODE"
            [ "$HTTP_CODE" = "200" ] && break
            [ $i -lt 3 ] && sleep 15
          done

          echo "📥 HTTP Code final: $HTTP_CODE"

          # HTTP 404 = Rentas todavía no publicó el padrón de este período.
          # Los primeros días del mes es esperable, así que salimos sin marcar el
          # run como fallido (el cron reintenta al día siguiente). Recién el día 5
          # lo tratamos como alerta real, para recibir UN mail y no cinco.
          if [ "$HTTP_CODE" = "404" ]; then
            rm -f "$FILENAME"
            echo "success=false" >> $GITHUB_OUTPUT
            if [ "$DIA_DEL_MES" -ge 5 ]; then
              echo "❌ Día $DIA_DEL_MES y el padrón sigue sin publicarse (HTTP 404)."
              echo "::error::El padrón $FILENAME no fue publicado por Rentas al día $DIA_DEL_MES del mes."
              exit 1
            fi
            echo "⏳ El padrón aún no fue publicado (HTTP 404). Se reintenta mañana."
            echo "::notice::Padrón no publicado todavía (día $DIA_DEL_MES). Reintento automático mañana."
            exit 0
          fi

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ Error: HTTP $HTTP_CODE"
            echo "::error::Descarga falló con HTTP $HTTP_CODE"
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Verificar que el archivo existe y tiene tamaño razonable
          if [ ! -f "$FILENAME" ]; then
            echo "❌ Error: Archivo no creado"
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          FILE_SIZE=$(stat -c%s "$FILENAME")
          echo "📊 Tamaño: $FILE_SIZE bytes"

          # El archivo debe ser > 100KB para ser válido
          if [ "$FILE_SIZE" -lt 100000 ]; then
            echo "❌ Error: Archivo muy pequeño ($FILE_SIZE bytes), probablemente inválido"
            head -c 500 "$FILENAME"  # Primeros bytes para debug (evita volcar binario entero)
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Verificar que es un RAR válido (magic bytes: Rar!)
          MAGIC=$(head -c 4 "$FILENAME" | od -A n -t x1 | tr -d ' ')
          if [ "$MAGIC" != "52617221" ]; then
            echo "❌ Error: No es un archivo RAR válido (magic: $MAGIC)"
            echo "success=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "✅ Archivo RAR válido descargado"
          echo "success=true" >> $GITHUB_OUTPUT
          echo "filesize=$FILE_SIZE" >> $GITHUB_OUTPUT

          ls -la "$FILENAME"

      - name: Crear metadata.json
        if: steps.check_release.outputs.exists == 'false' && steps.download.outputs.success == 'true'
        id: metadata
        run: |
          # Fecha/hora en UTC y Argentina
          DOWNLOAD_UTC=$(date -u '+%Y-%m-%dT%H:%M:%SZ')
          DOWNLOAD_AR=$(TZ='America/Argentina/Buenos_Aires' date '+%Y-%m-%d %H:%M:%S')

          # Crear metadata.json
          cat > metadata.json << EOF
          {
            "periodo": "${{ steps.periodo.outputs.year }}-${{ steps.periodo.outputs.month }}",
            "archivo": "${{ steps.periodo.outputs.filename }}",
            "tamano_bytes": ${{ steps.download.outputs.filesize }},
            "descarga_utc": "${DOWNLOAD_UTC}",
            "descarga_argentina": "${DOWNLOAD_AR}",
            "fuente": "rentasjujuyonline.gob.ar",
            "workflow_run": "${{ github.run_id }}",
            "commit": "${{ github.sha }}"
          }
          EOF

          echo "📄 metadata.json creado:"
          cat metadata.json

          echo "download_utc=$DOWNLOAD_UTC" >> $GITHUB_OUTPUT
          echo "download_ar=$DOWNLOAD_AR" >> $GITHUB_OUTPUT

      - name: Crear Release
        if: steps.check_release.outputs.exists == 'false' && steps.download.outputs.success == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.periodo.outputs.tag }}
          name: "Padrón IIBB Jujuy ${{ steps.periodo.outputs.year }}-${{ steps.periodo.outputs.month }}"
          body: |
            ## Padrón de Percepciones IIBB - Jujuy

            **Periodo:** ${{ steps.periodo.outputs.year }}-${{ steps.periodo.outputs.month }}
            **Archivo:** `${{ steps.periodo.outputs.filename }}`
            **Tamaño:** ${{ steps.download.outputs.filesize }} bytes
            **Descargado:** ${{ steps.metadata.outputs.download_ar }} (Argentina)

            ### Archivos incluidos
            - `${{ steps.periodo.outputs.filename }}` - Padrón RAR original
            - `metadata.json` - Metadata con fecha exacta de descarga

            ### URL de descarga directa
            ```
            https://github.com/${{ github.repository }}/releases/download/${{ steps.periodo.outputs.tag }}/${{ steps.periodo.outputs.filename }}
            ```

            ### Metadata
            ```
            https://github.com/${{ github.repository }}/releases/download/${{ steps.periodo.outputs.tag }}/metadata.json
            ```

            ---
            *Descargado automáticamente desde Rentas Jujuy via GitHub Actions*
          files: |
            ${{ steps.periodo.outputs.filename }}
            metadata.json
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resumen
        run: |
          echo "## 📋 Resumen" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Campo | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Periodo | ${{ steps.periodo.outputs.year }}-${{ steps.periodo.outputs.month }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Archivo | ${{ steps.periodo.outputs.filename }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | ${{ steps.periodo.outputs.tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Release existía | ${{ steps.check_release.outputs.exists }} |" >> $GITHUB_STEP_SUMMARY
          if [ "${{ steps.download.outputs.success }}" == "true" ]; then
            echo "| Descarga | ✅ Exitosa |" >> $GITHUB_STEP_SUMMARY
            echo "| Tamaño | ${{ steps.download.outputs.filesize }} bytes |" >> $GITHUB_STEP_SUMMARY
            echo "| Fecha (Argentina) | ${{ steps.metadata.outputs.download_ar }} |" >> $GITHUB_STEP_SUMMARY
          fi
